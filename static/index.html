<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VidMind — AI Video Assistant</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">🎬</span>
        <div>
          <h1>VidMind</h1>
          <p>Transcribe, summarize, and chat with any meeting or video.</p>
        </div>
      </div>

      <form id="analyze-form" class="input-panel">
        <label for="source">YouTube URL</label>
        <input
          id="source"
          name="source"
          type="url"
          placeholder="https://youtube.com/watch?v=..."
        />

        <div class="divider"><span>or</span></div>

        <label for="file">Upload audio / video file</label>
        <input id="file" name="file" type="file" accept="audio/*,video/*" />

        <label for="language">Language</label>
        <select id="language" name="language">
          <option value="english">English</option>
          <option value="hinglish">Hinglish</option>
        </select>

        <button type="submit" id="analyze-btn" class="btn primary">Analyze</button>
        <button type="button" id="clear-btn" class="btn secondary hidden">Clear / New Video</button>
      </form>

      <div id="status-box" class="status-box hidden">
        <div class="spinner"></div>
        <p id="status-text">Processing...</p>
      </div>
    </aside>

    <main class="content">
      <section id="welcome" class="welcome">
        <h2>Get started</h2>
        <p>Enter a YouTube URL or upload a local file, choose a language, and click <strong>Analyze</strong>.</p>
      </section>

      <section id="results" class="results hidden">
        <header class="results-header">
          <h2 id="result-title">Meeting title</h2>
        </header>

        <nav class="tabs" role="tablist">
          <button class="tab active" data-tab="summary">Summary</button>
          <button class="tab" data-tab="actions">Action Items</button>
          <button class="tab" data-tab="decisions">Key Decisions</button>
          <button class="tab" data-tab="questions">Open Questions</button>
          <button class="tab" data-tab="transcript">Transcript</button>
          <button class="tab" data-tab="chat">Chat</button>
        </nav>

        <div class="tab-panels">
          <article id="panel-summary" class="tab-panel active markdown-body"></article>
          <article id="panel-actions" class="tab-panel markdown-body"></article>
          <article id="panel-decisions" class="tab-panel markdown-body"></article>
          <article id="panel-questions" class="tab-panel markdown-body"></article>
          <article id="panel-transcript" class="tab-panel transcript-panel"></article>

          <article id="panel-chat" class="tab-panel chat-panel">
            <div id="chat-messages" class="chat-messages"></div>
            <form id="chat-form" class="chat-form">
              <input
                id="chat-input"
                type="text"
                placeholder="Ask anything about the video..."
                autocomplete="off"
              />
              <button type="submit" class="btn primary">Send</button>
            </form>
          </article>
        </div>
      </section>

      <div id="error-box" class="error-box hidden"></div>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
